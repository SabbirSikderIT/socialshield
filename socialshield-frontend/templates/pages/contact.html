{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="auth-wrap container">
  <form class="auth-card wide glass" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <span class="auth-emoji">🕊️</span>
    <h1>Contact us</h1>
    <p class="sub">Prefer writing to talking? Same. Send us a message.</p>
    <div class="form-row">
      <div class="form-group"><label>Name</label><input class="input" name="name" value="{{ current_user.full_name if current_user.is_authenticated else '' }}"></div>
      <div class="form-group"><label>Email</label><input class="input" type="email" name="email" required value="{{ current_user.email if current_user.is_authenticated else '' }}"></div>
    </div>
    <div class="form-group"><label>Subject</label><select class="input" name="subject"><option>General question</option><option>Suggest an event</option><option>Report a problem</option><option>Safety concern</option><option>Feedback</option></select></div>
    <div class="form-group"><label>Message</label><textarea class="input" name="message" required></textarea></div>
    <button class="btn btn-primary btn-block btn-lg">Send message</button>
  </form>
</div>
{% endblock %}
