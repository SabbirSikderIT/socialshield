{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap container">
  <form class="auth-card glass" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <span class="auth-emoji">🛡️</span>
    <h1>Welcome back</h1>
    <p class="sub">Your quiet corner missed you.</p>
    <div class="form-group"><label for="identifier">Username or email</label>
      <input class="input" id="identifier" name="identifier" required autofocus autocomplete="username" value="{{ request.form.get('identifier','') }}"></div>
    <div class="form-group"><label for="password">Password</label>
      <div class="pw-field"><input class="input" type="password" id="password" name="password" required autocomplete="current-password"><button type="button" class="pw-toggle" aria-label="Show password">👁️</button></div></div>
    <div class="flex between mb-3">
      <label class="check"><input type="checkbox" name="remember" value="1"> Remember me</label>
      <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
    </div>
    <button class="btn btn-primary btn-block btn-lg">Log in</button>
    <p class="center mt-2">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    <div class="demo-hint">🌸 Demo account: <b>demo</b> / <b>demo1234</b></div>
  </form>
</div>
{% endblock %}
